<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Gym Logbuch</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }
        h2 {
            margin-top: 50px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid black;
            padding: 6px;
            text-align: center;
        }
        th {
            background-color: #f2f2f2;
        }
        input {
            width: 90%;
            border: none;
            text-align: center;
        }
        .header-info {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

<h1>Workout Logbuch</h1>

<h2>Training manuell wählen</h2>
<button onclick="setDay(0)">PushFB</button>
<button onclick="setDay(1)">PullFB</button>
<button onclick="setDay(2)">Rest</button>

<!-- PUSH FB -->
<h2 id="pushHeader">PushFB</h2>
<table id="pushTable">
    <tr>
        <th rowspan="2">Übung</th>
        <th colspan="2">Aufwärmsatz</th>
        <th colspan="2">Arbeitssatz 1</th>
        <th colspan="2">Arbeitssatz 2</th>
    </tr>
    <tr>
        <th>Gewicht</th>
        <th>Wdh</th>
        <th>Gewicht</th>
        <th>Wdh</th>
        <th>Gewicht</th>
        <th>Wdh</th>
    </tr>
    <!-- 8 Übungszeilen -->
    <tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
</table>


<!-- PULL FB -->
<h2 id="pullHeader">PullFB</h2>
<table id="pullTable">
    <tr>
        <th rowspan="2">Übung</th>
        <th colspan="2">Aufwärmsatz</th>
        <th colspan="2">Arbeitssatz 1</th>
        <th colspan="2">Arbeitssatz 2</th>
    </tr>
    <tr>
        <th>Gewicht</th>
        <th>Wdh</th>
        <th>Gewicht</th>
        <th>Wdh</th>
        <th>Gewicht</th>
        <th>Wdh</th>
    </tr>
    <!-- 8 Übungszeilen -->
    <tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
    <tr><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td><td><input></td></tr>
</table>


<button onclick="saveWorkout()">Training speichern</button>

<h2>Gespeicherte Trainings-Tage</h2>
<div id="history"></div>


<script>
/* Tabellen initial verstecken */
document.getElementById("pushTable").style.display = "none";
document.getElementById("pushHeader").style.display = "none";
document.getElementById("pullTable").style.display = "none";
document.getElementById("pullHeader").style.display = "none";

function saveWorkout() {
   let cycleDay = getCycleDay();
    let today = new Date();
    let formattedDate = today.getDate().toString().padStart(2,'0') + '.' +
                        (today.getMonth() + 1).toString().padStart(2,'0') + '.' +
                        today.getFullYear();

    let workout = { date: formattedDate, type: "", data: [] };

    // PUSH Tabelle auslesen
    if(cycleDay === 0){
    workout.type = "push";

    let rows = document.querySelectorAll("#pushTable tr");
    rows.forEach((row,index)=>{
        if(index>1){
            let inputs = row.querySelectorAll("input");
            if(inputs.length>0){
                workout.data.push([...inputs].map(input=>input.value));
            }
        }
    });
}

else if(cycleDay === 1){
    workout.type = "pull";

    let rows = document.querySelectorAll("#pullTable tr");
    rows.forEach((row,index)=>{
        if(index>1){
            let inputs = row.querySelectorAll("input");
            if(inputs.length>0){
                workout.data.push([...inputs].map(input=>input.value));
            }
        }
    });
}

else{
    alert("Restday wird nicht gespeichert");
    return;
}

    let history = JSON.parse(localStorage.getItem("workouts")) || [];

// prüfen ob heute schon existiert
let existingIndex = history.findIndex(w => w.date === formattedDate);

if(existingIndex !== -1){
    // überschreiben
    history[existingIndex] = workout;
} else {
    // neu hinzufügen
    history.push(workout);
}

localStorage.setItem("workouts", JSON.stringify(history));

    displayHistory();
nextDay();
showTodayWorkout();

}

/* Lädt das letzte Workout in die Tabelle(n), ohne das Display zu ändern */
function loadLastWorkout(type){
    let history = JSON.parse(localStorage.getItem("workouts")) || [];
    if(history.length === 0) return;

    // rückwärts durchgehen → letzte passende Einheit finden
    let lastWorkout = [...history].reverse().find(w => {
        if(type === "push"){
            return w.push.some(row => row[0] !== "");
        }
        if(type === "pull"){
            return w.pull.some(row => row[0] !== "");
        }
    });

    if(!lastWorkout) return;

    if(type === "push"){
        let pushRows = document.querySelectorAll("#pushTable tr");
        pushRows.forEach((row,index)=>{
            if(index>1 && lastWorkout.push[index-2]){
                let inputs = row.querySelectorAll("input");
                lastWorkout.push[index-2].forEach((val,i)=>inputs[i].value = val);
            }
        });
    }

    if(type === "pull"){
        let pullRows = document.querySelectorAll("#pullTable tr");
        pullRows.forEach((row,index)=>{
            if(index>1 && lastWorkout.pull[index-2]){
                let inputs = row.querySelectorAll("input");
                lastWorkout.pull[index-2].forEach((val,i)=>inputs[i].value = val);
            }
        });
    }
}

/* Historie anzeigen */
function displayHistory(){
    let history = JSON.parse(localStorage.getItem("workouts")) || [];
    let container = document.getElementById("history");
    container.innerHTML = "";

    history.slice().reverse().forEach(workout=>{
        let wrapper = document.createElement("div");
        wrapper.style.border = "1px solid black";
        wrapper.style.marginBottom = "15px";
        wrapper.style.padding = "10px";

        let header = document.createElement("div");
        header.style.cursor = "pointer";
        header.style.fontWeight = "bold";
        header.innerText = workout.date + " ▼";

        let content = document.createElement("div");
        content.style.display = "none";
        content.style.marginTop = "10px";

        // PUSH
        content.innerHTML += `<h4>${workout.type.toUpperCase()}</h4>`;

workout.data.forEach(row=>{
    if(row[0]!==""){
        content.innerHTML += `<div style="margin-bottom:8px;">
            <strong>${row[0]}</strong><br>
            Aufwärm: ${row[1]}kg × ${row[2]}<br>
            Satz 1: ${row[3]}kg × ${row[4]}<br>
            Satz 2: ${row[5]}kg × ${row[6]}
        </div>`;
    }
});

        header.onclick = ()=>{ content.style.display = content.style.display==="none" ? "block":"none"; };
        wrapper.appendChild(header);
        wrapper.appendChild(content);
        container.appendChild(wrapper);
    });
}

/* Zeigt nur die Tabelle für den heutigen Tag */

function getCycleDay(){
    let cycleDay = localStorage.getItem("cycleDay");

    if(cycleDay === null){
        cycleDay = 0; // Start = Push
        localStorage.setItem("cycleDay", cycleDay);
    }

    return parseInt(cycleDay);
}

function showTodayWorkout() {
    let cycleDay = getCycleDay();

    document.getElementById("pushHeader").style.display = "none";
    document.getElementById("pushTable").style.display = "none";
    document.getElementById("pullHeader").style.display = "none";
    document.getElementById("pullTable").style.display = "none";

    if(cycleDay === 0){
        document.getElementById("pushHeader").style.display = "block";
        document.getElementById("pushTable").style.display = "table";
        loadLastWorkout("push");
    } 
    else if(cycleDay === 1){
        document.getElementById("pullHeader").style.display = "block";
        document.getElementById("pullTable").style.display = "table";
        loadLastWorkout("pull");
    } 
    else{
        alert("Restday");
    }
}

function nextDay(){
    let cycleDay = getCycleDay();
    cycleDay = (cycleDay + 1) % 3;
    localStorage.setItem("cycleDay", cycleDay);
}

function setDay(day){
    localStorage.setItem("cycleDay", day);
    showTodayWorkout();
}

/* Lade Trainings-Historie + letztes Workout + heute Tabelle */
displayHistory();

showTodayWorkout();
</script>

</body>
</html>
